[package]
name = "bluescreen-plugin-server"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false
description = "Servidor de plugins do BlueScreen: hospeda plugins (com versões) para as IDEs instalarem e atualizarem."

[[bin]]
name = "bluescreen-plugin-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bluescreen-sdk = { path = "../sdk" }
tokio = { version = "1.53.3", features = ["full"] }
