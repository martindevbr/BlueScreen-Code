[package]
name = "bluescreen-unilint"
version = "0.1.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false
description = "Linter Universal do BlueScreen: gramáticas Tree-sitter embutidas, uma passada por arquivo, regras por conceito"

[lib]
name = "unilint"
path = "src/lib.rs"

# servidor do plugin (o build.ps1 copia como server.exe)
[[bin]]
name = "bluescreen-unilint"
path = "src/bin/server.rs"
required-features = ["server"]

# linha de comando: benchmark e uso fora da IDE (cargo run -p bluescreen-unilint --release --bin unilint -- <pastas>)
[[bin]]
name = "unilint"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = ["server", "cli"]
server = ["dep:bluescreen-sdk", "dep:tokio", "dep:ignore"]
cli = ["dep:ignore"]

[dependencies]
bluescreen-sdk = { path = "../../sdk", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
ignore = { version = "0.4", optional = true }
tree-sitter = "0.27.1"
rayon = "1.12.0"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-bash = "0.25.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.25.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-lua = "0.5.0"
