[package]
name = "bluescreen-sdk"
version = "2.0.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false
description = "Base comum do BlueScreen e dos seus plugins: utilidades, Git/SVN, servidor de plugin e cliente do núcleo."

[dependencies]
anyhow = "1"
axum = "0.8.9"
bytes = "1"
chrono = "0.4"
dirs = "7"
futures-util = "0.3"
memchr = "2"
parking_lot = "0.12"
rand = "0.10.3"
rayon = "1"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
