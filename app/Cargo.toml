[package]
name = "bluescreen"
# X.Y daqui; o Z de cada versão publicada é o GitHub Actions que escolhe (.github/workflows/release.yml)
version = "2.1.0"
edition = "2024"
repository = "https://github.com/martindevbr/BlueScreen-IDE"
license-file = "../LICENSE"
publish = false

[workspace]
# Plugins com servidor próprio (pastas em plugins/ com Cargo.toml) entram no workspace só na hora do build.ps1:
# um "plugins/*" fixo aqui, com a pasta sem nenhum crate, faz o cargo recusar o manifesto inteiro (e com ele o
# cargo check, o rust-analyzer e qualquer ferramenta de Rust). O unilint (plugin oficial) fica sempre: a pasta existe.
members = [".", "sdk", "plugin-server", "plugins/unilint"]

[dependencies]
bluescreen-sdk = { path = "sdk" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
dirs = "7.0.0"
fancy-regex = "0.19.2"
futures-util = "0.3.34"
memchr = "2.8.3"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["full"] }
urlencoding = "2.1.3"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
wry = { version = "0.57.0", features = ["devtools"] }
sha2 = "0.10"

[build-dependencies]
winresource = "0.1.34"

# LTO "thin" e 16 unidades: o otimizador e o link usam todos os núcleos. Medido aqui (12 núcleos): atualizar só o
# núcleo cai de ~90 s ("fat" com 1 unidade, link num núcleo só) para ~30 s, e a instalação do zero fica em ~2 min.
# O exe fica ~1 MB maior; a diferença de velocidade numa IDE que passa o tempo esperando o usuário não aparece.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
