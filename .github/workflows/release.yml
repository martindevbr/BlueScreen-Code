# Versão nova a cada push na main que mexe no aplicativo: compila no Windows e publica num Release do GitHub
# (tag vX.Y.Z) o instalador BlueScreen-Setup-X.Y.Z.exe (Inno Setup, app/installer/BlueScreen.iss) e o zip que o
# atualizador da IDE e o Instalar BlueScreen.cmd baixam em vez de compilar na máquina.
#
# Número da versão: X.Y vem do app/Cargo.toml (mude lá para subir a versão maior ou a menor); Z é o próximo número
# livre entre as tags vX.Y.* (a primeira de uma série X.Y usa o Z do Cargo.toml). O Cargo.toml do repositório não
# é alterado: a versão entra só na compilação daqui (BlueScreen.exe e "Configurações > Apps" mostram ela).
# Para um push não gerar versão, ponha [skip release] na mensagem do commit.
name: Release

on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'Instalar BlueScreen.cmd', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

# uma de cada vez: duas versões ao mesmo tempo pegariam o mesmo número
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # as tags e o histórico, para o número da versão e a lista de mudanças

      - uses: dtolnay/rust-toolchain@stable

      # dependências compiladas ficam guardadas entre as versões: só o código do BlueScreen recompila
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Número da versão
        id: ver
        run: |
          $file = 'app/Cargo.toml'
          $toml = [IO.File]::ReadAllText($file)
          $re = [regex]'(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"'
          $m = $re.Match($toml); if (-not $m.Success) { throw "versão não encontrada em $file" }
          $maj = [int]$m.Groups[1].Value; $min = [int]$m.Groups[2].Value; $pat = [int]$m.Groups[3].Value
          $used = @(git tag --list "v$maj.$min.*" | ForEach-Object { if ($_ -match '^v\d+\.\d+\.(\d+)$') { [int]$Matches[1] } })
          if ($used.Count) { $pat = [Math]::Max($pat, ($used | Measure-Object -Maximum).Maximum + 1) }
          $v = "$maj.$min.$pat"
          [IO.File]::WriteAllText($file, $re.Replace($toml, "version = `"$v`"", 1))
          # o que mudou desde a versão anterior (vira a lista "O que mudou" no atualizador da IDE)
          $prev = git describe --tags --abbrev=0 --match 'v*' 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $log = @(git log --no-merges -n 80 --format='- %s (%h)' $range | Where-Object { $_ -notmatch '\[skip release\]' })
          $notes = if ($log.Count) { $log -join "`n" } else { '- Recompilação sem mudanças de código' }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/notes.md", $notes)
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "BlueScreen $v (anterior: $prev)"

      - name: Testes
        working-directory: app
        run: cargo test --workspace --release

      - name: Compilar
        working-directory: app
        run: ./build.ps1

      # instalador clássico (assistente: pasta, atalhos, desinstalador), feito com o Inno Setup
      - name: Instalador (.exe)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" app/installer/BlueScreen.iss
          if ($LASTEXITCODE) { throw "ISCC terminou com código $LASTEXITCODE" }

      - name: Empacotar
        id: pkg
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zip = "BlueScreen-$v-windows-x64.zip"; $setup = "BlueScreen-Setup-$v.exe"
          # o conteúdo de dist\BlueScreen na raiz do zip (BlueScreen.exe, wwwroot\, plugins\): é o que o atualizador da IDE baixa
          Compress-Archive -Path 'app/dist/BlueScreen/*' -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item "app/dist/$setup" $setup
          foreach ($f in $zip, $setup) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$f.sha256", "$hash  $f`n")
            Write-Host ("{0}: {1:N1} MB, sha256 {2}" -f $f, ((Get-Item $f).Length / 1MB), $hash)
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'; $zip = '${{ steps.pkg.outputs.zip }}'; $setup = '${{ steps.pkg.outputs.setup }}'
          # instalador primeiro: é o que a maioria baixa na página do Release
          [IO.File]::AppendAllText("$env:RUNNER_TEMP/notes.md", "`n`n**Instalar:** baixe o ``$setup`` e siga o assistente. Quem já tem o BlueScreen recebe esta versão pela própria IDE.")
          gh release create "v$v" $setup "$setup.sha256" $zip "$zip.sha256" --target $env:GITHUB_SHA --title "BlueScreen $v" --notes-file "$env:RUNNER_TEMP/notes.md" --latest
